services:
  python-backend:
    build:
      context: ./IA_Predictiva
    environment:
      - ENV=dev
    networks:
      - app-network
    ports:
      - "5001:5000"

  dotnet-backend:
    build:
      context: ./BlutTruckAPI
      dockerfile: Dockerfile
    ports:
      - "9000:3000"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - app-network

  vue-frontend:
    build:
      context: ./blutTruck-Front
      dockerfile: Dockerfile
    ports:
      - "3001:5173"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=http://dotnet-backend:3000
    depends_on:
      - python-backend
      - dotnet-backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
