name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        if: matrix.language == 'csharp'
        with:
          dotnet-version: "8.0.x"
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v3

  secrets:
    name: Gitleaks (secret scanning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --no-git --source /repo --redact --verbose

  trivy-fs:
    name: Trivy (dependencias y configuración)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Informativo: muestra HIGH/CRITICAL con parche disponible.
      - name: Trivy filesystem scan
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:latest fs \
            --scanners vuln,misconfig --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 /src

  containers:
    name: Trivy (imágenes Docker)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: api, context: BlutTruckAPI }
          - { name: ia, context: IA_Predictiva }
          - { name: front, context: blutTruck-Front }
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bluttruck-${{ matrix.name }}:ci ${{ matrix.context }}
      - name: Trivy image scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 bluttruck-${{ matrix.name }}:ci
